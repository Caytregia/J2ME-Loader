name: Build J2ME Loader Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The release keystore is stored in GitHub Secrets (see keystore-info.txt).
      # Without the secrets only the debug APK is built.
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > keystore.properties
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS are not set: building the debug APK only."
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFdroidDebug --stacktrace

      - name: Build release APK
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew assembleFdroidRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Loader-Mod-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Loader-Mod-release
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
